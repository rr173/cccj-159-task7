<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>光罩中心 · 窗口与 lot 编排</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0f1420; --panel:#182030; --line:#2a3550; --fg:#e6ebf5; --mut:#8b97ad;
  --ok:#2fbf71; --bad:#e5484d; --warn:#e5a33b; --accent:#4c8dff; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--fg); }
header { padding:14px 22px; background:#131a28; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
header h1 { font-size:17px; margin:0; }
nav a { color:var(--mut); margin-right:16px; text-decoration:none; }
nav a.on { color:var(--fg); }
.wrap { padding:20px 22px; display:grid; grid-template-columns: 400px 1fr; gap:18px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
.panel h2 { font-size:14px; margin:0 0 12px; color:#b9c6e0; }
label { display:block; font-size:12px; color:var(--mut); margin:8px 0 3px; }
input,select,textarea { width:100%; background:#0e1524; color:var(--fg);
  border:1px solid var(--line); border-radius:6px; padding:7px 9px; font-size:13px; }
button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 12px;
  font-size:12.5px; cursor:pointer; margin:6px 6px 0 0; }
button.ghost { background:#263149; }
button.danger { background:#5a2630; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.tag { display:inline-block; padding:1px 8px; border-radius:20px; font-size:11px; }
.tag.OK,.tag.PASS,.tag.ACTIVE,.tag.DONE,.tag.WIN,.tag.EXPOSED,.tag.READY { background:rgba(47,191,113,.18); color:var(--ok); }
.tag.FAIL,.tag.ERROR,.tag.DENIED,.tag.LOSE,.tag.CANCELLED,.tag.FAILED { background:rgba(229,72,77,.18); color:var(--bad); }
.tag.WARN,.tag.PENDING,.tag.QUEUED,.tag.PACKAGING,.tag.PLANNED { background:rgba(229,163,59,.18); color:var(--warn); }
.tag.SEALED,.tag.SUPERSEDED { background:#2c3550; color:#aab6cf; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--mut); font-weight:500; }
.mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; }
.muted { color:var(--mut); }
.item { padding:9px 11px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; cursor:pointer; }
.item:hover { border-color:var(--accent); }
.item.sel { border-color:var(--accent); background:#1b2740; }
#toast { position:fixed; right:18px; bottom:18px; max-width:520px; z-index:9; }
.toast { padding:10px 14px; border-radius:8px; margin-top:8px; font-size:13px;
  background:#20304d; border:1px solid var(--line); white-space:pre-wrap; }
.toast.err { border-color:var(--bad); } .toast.ok { border-color:var(--ok); }
code.rej { color:var(--bad); }
.graph { font-family:ui-monospace,monospace; font-size:12px; white-space:pre; }
</style>
</head>
<body data-schedule>
<header>
  <h1>曝光窗口 / wafer lot 编排</h1>
  <nav><a href="/">资料与交付</a><a href="/schedule" class="on">窗口 / lot 编排</a>
    <a href="/fab">晶圆厂交付包</a></nav>
  <span class="muted" style="font-size:12px">操作人</span><select id="user" style="width:190px"></select>
</header>
<div class="wrap">
  <div>
    <div class="panel">
      <h2>① wafer lot</h2>
      <div class="row"><input id="lname" value="WAFER-LOT-7788" style="flex:1">
        <button onclick="createLot()">建 lot</button></div>
      <div id="lots" style="margin-top:10px"></div>
    </div>
    <div class="panel" id="bookPanel" hidden>
      <h2>② 预订曝光窗口（需要操作编号）</h2>
      <label>mask set</label><select id="bset" onchange="loadSetSlots()"></select>
      <label>谱系节点（遵守先后次序）</label><select id="bnode"></select>
      <label>槽位</label><select id="bslot"></select>
      <label>曝光机</label><select id="bmachine"></select>
      <label>开始 / 结束（UTC ISO-8601，半开区间排他）</label>
      <input id="bstart" value="2026-10-05T08:00Z">
      <input id="bend" value="2026-10-05T10:00Z" style="margin-top:6px">
      <label>操作编号 op_id（相同编号可安全重试）</label>
      <input id="bop" class="mono" value="op-win-1">
      <button onclick="bindLot()">绑定 lot↔set</button>
      <button onclick="bookWin()">抢占窗口</button>
      <button class="ghost" onclick="sameOpAgain()">用同编号再试一次（演示幂等）</button>
      <p class="muted" style="font-size:12px">两名调度员同时抢同一机器时间段：
        先提交事务者唯一获胜，另一个得到 <code class="rej">WINDOW_OVERLAP</code>。</p>
    </div>
    <div class="panel">
      <h2>③ 未曝光双签替换构件</h2>
      <label>mask set / 节点 / 槽位</label>
      <select id="rset" onchange="loadReplaceForm()"></select>
      <select id="rnode" onchange="loadReplaceSlots()"></select>
      <select id="rslot"></select>
      <label>新文件名</label><input id="rname" value="L02-r2.gds">
      <label>新内容（layout 文本）</label><textarea id="rcontent"># GDS L2 rev2
@LAYER 2
</textarea>
      <label>原因</label><input id="rreason" value="poly 修正">
      <button onclick="replaceReq()">提出替换</button>
      <button class="ghost" style="background:#23402e" onclick="approve('ME','u_mei')">制造工程师批准</button>
      <button class="ghost" style="background:#23402e" onclick="approve('LO','u_lo')">版图负责人批准</button>
      <p class="muted" style="font-size:12px">两人不能是同一自然人；双签后产生新 REVISION
        谱系节点，下游 PLANNED 窗口全部取消重排。</p>
      <div id="repls"></div>
    </div>
    <div class="panel">
      <h2>④ 曝光后 delta 返工</h2>
      <label>槽位 / 文件名 / 内容</label>
      <input id="dwslot" value="L01">
      <input id="dwname" value="L01-r1.gds" style="margin-top:6px">
      <textarea id="dwcontent"># GDS L1 rev1
@LAYER 1
</textarea>
      <input id="dwreason" value="L01 颗粒缺陷返工" style="margin-top:6px">
      <button onclick="rework()">创建 delta set + 返工计划</button>
      <div id="reworks" style="margin-top:8px"></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <h2>谱系与节点状态</h2>
      <div id="lineage" class="graph"></div>
    </div>
    <div class="panel">
      <h2>曝光窗口时间线</h2>
      <table><thead><tr><th>机器</th><th>lot</th><th>节点/槽位</th><th>时间</th><th>状态</th><th>op</th><th></th></tr></thead>
      <tbody id="wins"></tbody></table>
    </div>
    <div class="panel">
      <h2>抢占裁决（唯一赢家可追溯）</h2>
      <table><thead><tr><th>时间</th><th>资源</th><th>调度员</th><th>裁决</th><th>原因</th><th>op_id</th></tr></thead>
      <tbody id="arbs"></tbody></table>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/mask-static/mask.js"></script>
<script src="/mask-static/mask_schedule.js"></script>
</body>
</html>
